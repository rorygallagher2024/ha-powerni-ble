name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check custom_components tests
      - name: Type check with mypy
        run: mypy custom_components/powerni_ble
      - name: Compile check
        run: python -m py_compile custom_components/powerni_ble/*.py tests/*.py
      - name: Run tests
        run: pytest -v
      - name: Validate JSON, translations, and brand assets
        run: |
          python - << 'EOF'
          import json, pathlib
          root = pathlib.Path(".")
          parsed = {}
          for rel in (
              "hacs.json",
              "custom_components/powerni_ble/manifest.json",
              "custom_components/powerni_ble/strings.json",
              "custom_components/powerni_ble/translations/en.json",
          ):
              parsed[rel] = json.loads((root / rel).read_text())
          assert (
              parsed["custom_components/powerni_ble/strings.json"]
              == parsed["custom_components/powerni_ble/translations/en.json"]
          ), "strings.json and translations/en.json differ"
          for asset in (
              "custom_components/powerni_ble/brand/icon.png",
              "custom_components/powerni_ble/brand/icon@2x.png",
              "docs/images/device-page.png",
              "docs/images/configure-dialog.png",
              "docs/images/energy-dashboard.png",
          ):
              p = root / asset
              assert p.is_file() and p.stat().st_size > 0, f"Missing {asset}"
              assert p.read_bytes()[:8] == b"\x89PNG\r\n\x1a\n", f"Invalid PNG header: {asset}"
          EOF
